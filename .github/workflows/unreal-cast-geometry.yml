name: Unreal cast geometry (engine-free)

on:
  pull_request:
    paths:
      - 'unreal/ArtSource/Characters/**'
      - '.github/workflows/unreal-cast-geometry.yml'
  push:
    paths:
      - 'unreal/ArtSource/Characters/**'
      - '.github/workflows/unreal-cast-geometry.yml'

permissions:
  contents: read

jobs:
  verify-static-lookdev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daz reference-only readiness policy and privacy fixture tests
        run: python3 -m unittest discover -s unreal/ArtSource/Characters/DazPilot -p 'test_dim_readiness_audit.py' -v
      - name: Check glTF structure, indices, normals and surface orientation
        run: python3 unreal/ArtSource/Characters/check_cast_geometry.py
      - name: Verify cast source pose, facing direction and adversarial flips
        run: python3 unreal/ArtSource/Characters/check_cast_orientation.py
      - name: Cast importer preflight and sideways-axis negative controls
        run: python3 unreal/ArtSource/Characters/editor_intake.py --preflight-only
      - name: Test native capture policy without launching Unreal
        run: python3 unreal/ArtSource/Characters/capture_ender_review.py --self-test
      - name: Regenerate source assets and confirm exact bytes
        env:
          TSTSS_CAST_OUTPUT: unreal/ArtSource/Characters/Candidates
        run: |
          python3 unreal/ArtSource/Characters/build_cast.py
          git diff --exit-code -- unreal/ArtSource/Characters/Candidates
      - name: Confirm limited scope of geometry and pose gates
        run: echo 'Source-space checks only; native UE scene captures and visual acceptance remain open.'
