name: Unreal cast geometry (engine-free)

on:
  pull_request:
    paths:
      - 'unreal/ArtSource/Characters/**'
      - '.github/workflows/unreal-cast-geometry.yml'
  push:
    paths:
      - 'unreal/ArtSource/Characters/**'
      - '.github/workflows/unreal-cast-geometry.yml'

permissions:
  contents: read

jobs:
  verify-static-lookdev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check glTF structure, indices, normals and surface orientation
        run: python3 unreal/ArtSource/Characters/check_cast_geometry.py
      - name: Check native-lineup receipt contract and canonical cast height order (engine-free)
        run: python3 -m unittest discover -s unreal/ArtSource/Characters -p test_stage_cast_lineup.py -v
      - name: Check screenshot PNG integrity and negative controls (engine-free)
        run: python3 -m unittest discover -s unreal/ArtSource/Characters -p test_verify_render_pngs.py -v
      - name: Prevent positional Unreal Rotator camera regressions (engine-free)
        run: python3 -m unittest discover -s unreal/ArtSource/Characters -p test_camera_rotator_contract.py -v
      - name: Verify isolated Ender facial sculpt geometry and determinism (engine-free)
        run: python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_fidelity_v1.py -v
      - name: Validate V2 connected cloth/hair topology and immutable source candidate (engine-free)
        run: python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_fidelity_v2.py -v
      - name: Validate native Ender V1 versus V2 comparison contract and guardrails (engine-free)
        run: |
          python3 -m unittest discover -s unreal/ArtSource/Characters -p 'test_ender_comparison_*.py' -v
          python3 -m py_compile unreal/ArtSource/Characters/capture_ender_comparison_native.py
      - name: Verify Ender V3 derived head/hair geometry, native receipt guards (engine-free)
        run: |
          python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_fidelity_v3.py -v
          python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_v3_native_captures.py -v
          python3 -m py_compile unreal/ArtSource/Characters/intake_ender_fidelity_v3.py unreal/ArtSource/Characters/capture_ender_fidelity_v3_native.py
      - name: Validate Ender V4 anatomical face-study geometry and fail-closed native receipts (engine-free)
        run: |
          python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_fidelity_v4.py -v
          python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_v4_native_captures.py -v
          python3 -m py_compile unreal/ArtSource/Characters/intake_ender_fidelity_v4.py unreal/ArtSource/Characters/capture_ender_fidelity_v4_native.py
      - name: Verify safe V5 MetaHuman authoring probe and anti-approval guards (engine-free)
        run: |
          python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_v5_metahuman_probe.py -v
          python3 -m py_compile unreal/ArtSource/Characters/probe_ender_v5_metahuman_native.py unreal/ArtSource/Characters/verify_ender_v5_metahuman_probe.py

      - name: Verify Ender V5 native landmark-index evidence and rejection gates (engine-free)
        run: |
          python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_v5_native_landmark_atlas.py -v
          python3 -m py_compile unreal/ArtSource/Characters/capture_ender_v5_native_landmarks.py unreal/ArtSource/Characters/verify_ender_v5_native_landmark_atlas.py unreal/ArtSource/Characters/render_ender_v5_native_landmark_atlas.py

      - name: Enforce creator-first Ender V5 face authority and reject false mapping (engine-free)
        run: |
          python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_v5_reference_priority.py -v
          python3 unreal/ArtSource/Characters/verify_ender_v5_reference_priority.py

      - name: Verify native Ender V5 geometric mirror pairs without anatomical inference (engine-free)
        run: |
          python3 -m unittest discover -s unreal/ArtSource/Characters -p test_ender_v5_geometric_pairs.py -v
          python3 unreal/ArtSource/Characters/verify_ender_v5_geometric_pairs.py

      - name: Check isolated V5 eye-authoring and face-repeatability scripts compile (engine-free)
        run: |
          python3 -m py_compile unreal/ArtSource/Characters/native_ender_v5_green_iris_mh4_study.py
          python3 -m py_compile unreal/ArtSource/Characters/verify_native_ender_v5_green_iris.py
          python3 -m py_compile unreal/ArtSource/Characters/verify_native_ender_v5_face_repeatability.py

      - name: Regenerate source assets and confirm exact bytes
        env:
          TSTSS_CAST_OUTPUT: unreal/ArtSource/Characters/Candidates
        run: |
          python3 unreal/ArtSource/Characters/build_cast.py
          git diff --exit-code -- unreal/ArtSource/Characters/Candidates
      - name: Confirm this is not an Unreal render or rig test
        run: echo 'Native screenshots require external GPU Editor evidence; this workflow alone cannot approve character likeness.'
