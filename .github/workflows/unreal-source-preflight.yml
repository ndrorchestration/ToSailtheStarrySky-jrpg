name: Unreal source preflight

on:
  pull_request:
    paths:
      - 'unreal/Source/**'
      - 'unreal/Tools/**'
      - 'unreal/Docs/**'
      - 'unreal/README.md'
      - 'unreal/Docs/DEPENDENCY_AND_EVIDENCE_REGISTER_2026-11-01.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/CHARACTER_AND_ART_AUTHORITY.md'
      - 'docs/LEVEL_ONE_STAT_RANK_CANON_2026_11_01.md'
      - 'data/design/level-one-rank-constraints.json'
      - 'tests/level-one-stat-ranks.test.js'
      - 'tools/validate-level-one-stat-ranks.js'
      - 'unreal/ToSailTheStarrySky.uproject'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unreal-source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: Unreal automation source registration (not native tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify checker self-tests
        run: python3 unreal/Tools/test_automation_registry.py
      - name: Compare expected and registered Unreal tests
        run: python3 unreal/Tools/check_automation_registry.py
      - name: Assert prior UE 5.8 native compatibility corrections (source-only)
        run: python3 -m unittest discover -s unreal/Tools -p 'test_ue58_composed_compatibility.py' -v
      - name: Validate seven-stop First Wake Prelude review authoring plan (source only)
        run: |
          python3 -m unittest discover -s unreal/Tools -p 'test_first_wake_prelude_interaction.py' -v
          python3 unreal/Tools/build_first_wake_prelude_interaction.py --validate
          python3 -m py_compile unreal/Tools/build_first_wake_prelude_interaction.py
      - name: Verify tracked V2 Prelude map, controls and separate native QA source
        run: |
          python3 -m unittest discover -s unreal/Tools -p 'test_first_wake_v2_independent.py' -v
          python3 unreal/Tools/verify_first_wake_v2_independent.py --source unreal
          python3 -m py_compile unreal/Tools/verify_first_wake_v2_independent.py
      - name: Validate third-person E interaction ray includes camera boom (source only)
        run: python3 -m unittest discover -s unreal/Tools -p 'test_first_wake_interaction_reach.py' -v
      - name: Check First Wake objective cue safety (source-only, no native UX claim)
        run: python3 -m unittest discover -s unreal/Tools -p 'test_first_wake_objective_review.py' -v
      - name: Compile actual First Wake objective C++ with API stand-ins and mutation control
        run: python3 unreal/Tools/check_first_wake_objective_compiled.py --self-test
      - name: Compile actual F5/F9 handler bodies with simulated PIE save protection
        run: python3 unreal/Tools/check_first_wake_pie_save_compiled.py --self-test
      - name: Verify Unreal and legacy declarations agree with draft branch dependency policy
        run: |
          python3 unreal/Tools/check_first_wake_dependency_contract.py
          python3 -m unittest discover -s unreal/Tools -p 'test_first_wake_dependency_contract.py' -v
      - name: Validate historical dependency register against its independent baseline
        run: |
          python3 unreal/Tools/check_dependency_contract.py
          python3 -m unittest discover -s unreal/Tools -p 'test_dependency_contract.py' -v
          python3 -m unittest discover -s unreal/Tools -p 'test_dependency_register_reconciliation.py' -v
      - name: Enforce relative-only Level 1 creator stat ranking (not game balance)
        run: node tests/level-one-stat-ranks.test.js
      - name: Reconcile authority and both dependency baselines without native claims
        run: |
          python3 unreal/Tools/check_integrated_review_contract.py
          python3 -m unittest discover -s unreal/Tools -p 'test_integrated_review_contract.py' -v
      - name: Reject detached Game startup false-positive and BufferReader crash logs
        run: python3 -m unittest discover -s unreal/Tools -p 'test_unreal_game_startup_log.py' -v
      - name: Compile and exercise actual DesignOnly C++ adapter (API doubles, not Unreal)
        run: python3 unreal/Tools/check_combat_design_only_compiled.py
