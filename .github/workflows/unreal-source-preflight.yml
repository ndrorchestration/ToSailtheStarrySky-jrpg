name: Unreal source preflight

on:
  pull_request:
    paths:
      - 'unreal/Source/**'
      - 'unreal/Tools/**'
      - '.github/workflows/unreal-source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: Unreal automation source registration (not native tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify checker self-tests
        run: python3 unreal/Tools/test_automation_registry.py
      - name: Compare expected and registered Unreal tests
        run: python3 unreal/Tools/check_automation_registry.py
      - name: Verify Aureate Wake Seaborne-only foil visibility (engine-free)
        run: python3 unreal/Tools/check_aureate_foil_visibility_contract.py
      - name: Reject partial mesh intake in offline clearance audit
        run: python3 unreal/Tools/test_aureate_full_vertex_coverage.py
      - name: Fail closed on Unreal-to-offline wing pose source drift
        run: python3 unreal/Tools/test_aureate_pose_source_parity.py
      - name: Reject stale V2 cross-lane inputs and false broad-phase clearance
        run: python3 unreal/Tools/test_aureate_v2_crosslane_envelope.py
      - name: Check exact triangle-surface distance narrow-phase fixtures
        run: python3 unreal/Tools/test_aureate_triangle_narrowphase.py
      - name: Assert pinned ordinary form route support screening contract
        run: python3 unreal/Tools/test_aureate_root_support_routes.py
      - name: Reject unapproved root support variant or changed provenance
        run: python3 unreal/Tools/test_aureate_support_variant_guard.py
      - name: Assert opt-in bridge plus living quarters coupling and source gate
        run: python3 unreal/Tools/test_aureate_bridge_habitation_source_contract.py
