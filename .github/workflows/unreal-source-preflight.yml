name: Unreal source preflight

on:
  pull_request:
    paths:
      - 'unreal/Source/**'
      - 'unreal/Tools/**'
      - 'unreal/Tests/**'
      - '.github/workflows/unreal-source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: Unreal automation source registration (not native tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify checker self-tests
        run: python3 unreal/Tools/test_automation_registry.py
      - name: Compare expected and registered Unreal tests
        run: python3 unreal/Tools/check_automation_registry.py
      - name: Validate noncanonical hull and canopy source contracts (not native Unreal)
        run: python3 -m unittest discover -s unreal/Tests -p 'test_aureate_hull_canopy_source.py' -v
      - name: Test authored wing-root GLB generation and native-component adapter source
        run: python3 -m unittest discover -s unreal/Tests -p 'test_author_aureate_root_support.py' -v
      - name: Test fail-closed authored wing-root import
        run: python3 -m unittest discover -s unreal/Tests -p 'test_import_aureate_root_support.py' -v
      - name: Run body integration source tests
        run: python3 -m unittest discover -s unreal/Tests -p 'test_aureate_body_integration.py' -v
      - name: Compile and exercise extracted C++ ship form-request safety logic (not UE engine)
        run: python3 unreal/Tests/check_aureate_body_request_cpp.py
