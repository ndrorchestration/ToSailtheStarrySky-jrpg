name: TSTSS First Wake audio source contract

on:
  push:
    branches:
      - review/ue58-audio-firstwake-foundation-20261111
  pull_request:
    paths:
      - 'unreal/DataSource/Audio/**'
      - 'unreal/Tools/*audio*'
      - '.github/workflows/firstwake-audio-contract.yml'
  workflow_dispatch:

jobs:
  audio-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-only audio event and PCM contract
        run: python3 unreal/Tools/test_audio_review_contract.py
      - name: Test resource, rights and weather integration refusal gates
        run: python3 unreal/Tools/test_audio_integration_source.py
      - name: Assert exact six review maps and sound-only staged bindings
        run: python3 unreal/Tools/test_audio_scene_contract.py
      - name: Deny non-detached or rights-unverified audio map staging
        run: python3 unreal/Tools/test_audio_stage_source.py
      - name: Generate bounded original review WAV files
        run: python3 unreal/Tools/build_audio_preview_samples.py --output "$RUNNER_TEMP/tstss-firstwake-audio-review"
      - name: Publish temporary original-QA preview files
        uses: actions/upload-artifact@v4
        with:
          name: tstss-firstwake-original-qa-audio
          path: ${{ runner.temp }}/tstss-firstwake-audio-review/
          if-no-files-found: error
          retention-days: 7
