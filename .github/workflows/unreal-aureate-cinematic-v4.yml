name: Unreal Aureate Wake cinematic V4 source integrity
on:
  pull_request:
    paths:
      - 'unreal/ArtSource/ShipReview/build_aureate_cinematic_v4.py'
      - 'unreal/Tools/import_aureate_cinematic_v4_review.py'
      - 'unreal/Tests/test_aureate_cinematic_v4.py'
      - 'unreal/Tools/aureate_v4_full_editor_actor_probe.py'
      - 'unreal/Tools/run_aureate_v4_full_editor_actor_probe.py'
      - 'unreal/Tools/author_aureate_v4_review_scene_plan.py'
      - 'unreal/Tools/aureate_v4_full_editor_skybourne_stage.py'
      - 'unreal/Tools/aureate_v4_full_editor_three_form_stage.py'
      - 'unreal/Tools/audit_aureate_v4_four_native_maps_readonly.py'
      - 'unreal/Tools/run_aureate_v4_four_map_native_readonly_audit.py'
      - 'unreal/Tools/aureate_v4_coupled_habitation_math.py'
      - 'unreal/Tools/stage_aureate_v4_coupled_habitation_native_pilot.py'
      - 'unreal/Tools/run_aureate_v4_coupled_habitation_native_pilot.py'
      - 'unreal/Tests/test_aureate_v4_four_native_map_audit_source.py'
      - 'unreal/Tests/test_aureate_v4_coupled_habitation_math.py'
      - 'unreal/Tests/test_aureate_v4_coupled_habitation_native_source.py'
      - 'unreal/Docs/AUREATE_V4_NATIVE_MAP_AUDIT_AND_HABITATION_PIVOT_2026_11_03.md'
      - 'unreal/Tools/run_aureate_v4_three_form_full_editor_stage.py'
      - 'unreal/Tests/test_aureate_v4_three_form_stage_source.py'
      - 'unreal/Docs/AUREATE_V4_ALL_FOUR_NATIVE_REVIEW_MAPS_2026_11_03.md'
      - 'unreal/Tools/run_aureate_v4_full_editor_skybourne_stage.py'
      - 'unreal/Tools/capture_aureate_v4_skybourne_native_gpu.py'
      - 'unreal/Tools/run_aureate_v4_skybourne_gpu_capture.py'
      - 'unreal/Tests/test_aureate_v4_full_editor_skybourne_source.py'
      - 'unreal/Docs/AUREATE_V4_NATIVE_SKYBOURNE_SCENE_EVIDENCE_2026_11_03.md'
      - 'unreal/Tests/test_aureate_v4_review_scene_plan.py'
      - 'unreal/Tests/test_aureate_v4_full_editor_actor_probe_source.py'
      - 'unreal/Docs/AUREATE_V4_DEPENDENCIES_AND_ACCELERATION_2026_11_03.md'
      - 'unreal/README.md'
      - 'unreal/Tools/README.md'
      - 'unreal/Docs/AUREATE_WAKE_APPROVED_ART_REFERENCE_2026-11-01.md'
      - 'unreal/Tools/bootstrap_aureate_cinematic_v4_sandbox.py'
      - 'unreal/Tools/native_aureate_cinematic_v4_import_entry.py'
      - 'unreal/Tools/run_aureate_cinematic_v4_native_import.py'
      - 'unreal/Tests/test_aureate_cinematic_v4_native_guard_source.py'
      - 'unreal/Docs/AUREATE_CINEMATIC_V4_NATIVE_IMPORT_EVIDENCE_2026_11_03.md'
      - 'unreal/Tests/test_import_aureate_cinematic_v4.py'
      - 'unreal/Docs/AUREATE_CINEMATIC_DETAIL_V4_2026-11-03.md'
      - '.github/workflows/unreal-aureate-cinematic-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all V4 source contracts without installing any dependency
        run: |
          python -m unittest discover -s unreal/Tests -p 'test_aureate_cinematic_v4.py' -v
          python -m unittest discover -s unreal/Tests -p 'test_import_aureate_cinematic_v4.py' -v
          python -m unittest discover -s unreal/Tests -p 'test_aureate_cinematic_v4_native_guard_source.py' -v
          python -m unittest discover -s unreal/Tests -p 'test_aureate_v4_review_scene_plan.py' -v
          python -m unittest discover -s unreal/Tests -p 'test_aureate_v4_full_editor_actor_probe_source.py' -v
          python -m unittest discover -s unreal/Tests -p 'test_aureate_v4_full_editor_skybourne_source.py' -v
          python -m unittest discover -s unreal/Tests -p 'test_aureate_v4_three_form_stage_source.py' -v
          python -m unittest discover -s unreal/Tests -p 'test_aureate_v4_four_native_map_audit_source.py' -v
          python -m unittest discover -s unreal/Tests -p 'test_aureate_v4_coupled_habitation_math.py' -v
          python -m unittest discover -s unreal/Tests -p 'test_aureate_v4_coupled_habitation_native_source.py' -v
      - name: Deterministically build verify and preflight candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aureate-cinematic-v4"
          python unreal/ArtSource/ShipReview/build_aureate_cinematic_v4.py --output-dir "$RUNNER_TEMP/aureate-cinematic-v4" --build > "$RUNNER_TEMP/v4-build-receipt.json"
          python unreal/ArtSource/ShipReview/build_aureate_cinematic_v4.py --output-dir "$RUNNER_TEMP/aureate-cinematic-v4" --verify > "$RUNNER_TEMP/v4-verify-receipt.json"
          cmp "$RUNNER_TEMP/v4-build-receipt.json" "$RUNNER_TEMP/v4-verify-receipt.json"
          python unreal/Tools/import_aureate_cinematic_v4_review.py --source-dir "$RUNNER_TEMP/aureate-cinematic-v4" --check
          python unreal/Tools/author_aureate_v4_review_scene_plan.py --out "$RUNNER_TEMP/aureate-v4-scene-plan.json"
          python unreal/Tools/author_aureate_v4_review_scene_plan.py --out "$RUNNER_TEMP/aureate-v4-scene-plan.json" --check
          echo "SOURCE_ONLY_NOT_NATIVE_UNREAL_NOT_CINEMATIC_APPROVAL"
