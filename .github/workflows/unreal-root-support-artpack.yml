name: Unreal Aureate Wake Root Support Art Source QA

on:
  push:
    branches:
      - feat/unreal-aureate-root-support-art-v1
    paths:
      - "unreal/Tools/author_aureate_root_support.py"
      - "unreal/Tests/test_author_aureate_root_support.py"
      - "unreal/Tools/import_aureate_root_support_review.py"
      - "unreal/Tests/test_import_aureate_root_support.py"
      - "unreal/Source/ToSailTheStarrySky/Public/AureateWakePreviewActor.h"
      - "unreal/Source/ToSailTheStarrySky/Private/AureateWakePreviewActor.cpp"
      - ".github/workflows/unreal-root-support-artpack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax verification
        run: |
          python -m py_compile unreal/Tools/author_aureate_root_support.py unreal/Tests/test_author_aureate_root_support.py unreal/Tools/import_aureate_root_support_review.py unreal/Tests/test_import_aureate_root_support.py
      - name: Deterministic GLB closed mesh and ship mount authority tests
        run: |
          python -m unittest discover -s unreal/Tests -p "test_author_aureate_root_support.py" -v
      - name: Test fail-closed Unreal support import preflight
        run: python -m unittest discover -s unreal/Tests -p "test_import_aureate_root_support.py" -v
      - name: Build source-only review candidate without third-party tools
        run: |
          python unreal/Tools/author_aureate_root_support.py --output-dir "$RUNNER_TEMP/root-support"
          test -s "$RUNNER_TEMP/root-support/AureateWake_RootSupport_Lookdev.glb"
          test -s "$RUNNER_TEMP/root-support/AureateWake_RootSupport_Manifest.json"
          python unreal/Tools/import_aureate_root_support_review.py --glb "$RUNNER_TEMP/root-support/AureateWake_RootSupport_Lookdev.glb" --manifest "$RUNNER_TEMP/root-support/AureateWake_RootSupport_Manifest.json" --check
      - name: Publish noncanonical review-only GLB and SHA manifest
        uses: actions/upload-artifact@v4
        with:
          name: AureateWake-FourWing-RootSupport-REVIEW
          path: ${{ runner.temp }}/root-support/*
          if-no-files-found: error
          retention-days: 30
