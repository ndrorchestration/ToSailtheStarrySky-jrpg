name: Unreal First Wake vertical-slice objects (source only)
on:
  pull_request:
    paths:
      - "unreal/Tools/generate_first_wake_slice_objects.py"
      - "unreal/Tools/stage_first_wake_slice_objects.py"
      - "unreal/Tools/run_first_wake_slice_objects_native.py"
      - "unreal/Tools/test_first_wake_slice_objects.py"
      - "unreal/ArtSource/VerticalSliceObjectsV1/**"
      - ".github/workflows/unreal-first-wake-slice-objects.yml"
  workflow_dispatch:
jobs:
  glb-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify deterministic GLB source, placement guards and manifest
        run: |
          python3 unreal/Tools/generate_first_wake_slice_objects.py --validate
          python3 unreal/Tools/stage_first_wake_slice_objects.py --validate
          python3 -m unittest discover -s unreal/Tools -p "test_first_wake_slice_objects.py" -v
      - name: Confirm no generated source/art drift
        run: |
          python3 unreal/Tools/generate_first_wake_slice_objects.py --build
          git diff --exit-code -- unreal/Tools unreal/ArtSource/VerticalSliceObjectsV1
      - name: Declare non-native scope
        run: echo "SOURCE_ONLY_PASS_NOT_UNREAL_IMPORTED_NOT_PIE"
