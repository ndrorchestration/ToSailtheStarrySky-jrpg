name: Unreal Envelope Exporter Source Guard

on:
  push:
    branches:
      - feat/skybourne-envelope-exporter
    paths:
      - "unreal/Tools/aureate_envelope_records.py"
      - "unreal/Tools/export_aureate_envelopes_native.py"
      - "unreal/Tools/run_aureate_envelope_export_native.py"
      - "unreal/Tests/test_aureate_envelope_*.py"
      - ".github/workflows/unreal-envelope-exporter-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and behavioural tests
        run: |
          python -m py_compile unreal/Tools/aureate_envelope_records.py unreal/Tools/export_aureate_envelopes_native.py unreal/Tools/run_aureate_envelope_export_native.py
          python -m unittest discover -s unreal/Tests -p "test_aureate_envelope_*.py" -v
          python -m unittest discover -s unreal/Tests -p "test_aureate_swept_clearance.py"
      - name: Check source patch whitespace
        run: git diff --check HEAD~1 HEAD
