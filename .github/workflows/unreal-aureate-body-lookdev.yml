name: Aureate Wake authored-body lookdev source gate
on:
  pull_request:
    paths:
      - 'unreal/ArtSource/ShipReview/**'
      - 'unreal/Tests/test_aureate_body_lookdev.py'
      - 'unreal/Tests/test_aureate_fidelity_v2.py'
      - 'unreal/Tests/test_aureate_fidelity_v2_intake.py'
      - 'unreal/Tests/test_aureate_v2_full_binary_geometry.py'
      - '.github/workflows/unreal-aureate-body-lookdev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  body-mesh-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-only regression tests; no game import
        run: python3 -m unittest discover -s unreal/Tests -p test_aureate_body_lookdev.py -v
      - name: Generate exact two-GLB candidate and verify hashes
        run: |
          python3 unreal/ArtSource/ShipReview/build_aureate_body_review.py --build --output-dir /tmp/tstss_body_review
          python3 unreal/ArtSource/ShipReview/build_aureate_body_review.py --verify --output-dir /tmp/tstss_body_review
          python3 unreal/ArtSource/ShipReview/import_aureate_body_review.py --check --folder /tmp/tstss_body_review
      - name: V2 approved-palette source-only regression tests and V1 byte identity
        run: python3 -m unittest discover -s unreal/Tests -p test_aureate_fidelity_v2.py -v
      - name: V2 native importer safety source tests (no engine)
        run: python3 -m unittest discover -s unreal/Tests -p test_aureate_fidelity_v2_intake.py -v
      - name: Generate and verify white-gold and blue-glass V2 review assets
        run: |
          python3 unreal/ArtSource/ShipReview/build_aureate_fidelity_v2.py --build --output-dir /tmp/tstss_approved_direction_v2
          python3 unreal/ArtSource/ShipReview/build_aureate_fidelity_v2.py --verify --output-dir /tmp/tstss_approved_direction_v2
          python3 unreal/ArtSource/ShipReview/import_aureate_fidelity_v2.py --check --folder /tmp/tstss_approved_direction_v2
      - name: Complete actual GLB binary vertex/index and normal checks
        run: |
          python3 -m unittest discover -s unreal/Tests -p test_aureate_v2_full_binary_geometry.py -v
          python3 unreal/ArtSource/ShipReview/audit_aureate_v2_glb_geometry.py --folder /tmp/tstss_approved_direction_v2
      - name: Explicit provenance limits
        run: echo "Only offline GLB checks; native UE import, orientation, art, collision, gameplay and Orbiter remain unverified."
