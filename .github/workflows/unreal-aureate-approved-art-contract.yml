name: Aureate Wake approved visual reference safety gate
on:
  pull_request:
    paths:
      - 'unreal/ArtSource/ShipReview/aureate_wake_approved_art_contract.json'
      - 'unreal/ArtSource/ShipReview/verify_aureate_reference.py'
      - 'unreal/Tests/test_aureate_approved_art_contract.py'
      - 'unreal/Tests/test_aureate_form_naming_v2.py'
      - 'unreal/Tools/Verify-StarbourneNames.ps1'
      - 'unreal/Docs/STARBOURNE_NATIVE_REFLECTION_ACCEPTANCE.md'
      - 'unreal/Source/ToSailTheStarrySky/Private/Tests/AureateWakeCanonicalFormNamesTests.cpp'
      - 'unreal/ArtSource/ShipReview/aureate_wake_canonical_form_names_v2.json'
      - 'unreal/Docs/AUREATE_WAKE_CANONICAL_CONFIGURATION_NAMES_2026-11-01.md'
      - 'unreal/Tests/check_aureate_body_binding_logic.py'
      - 'unreal/Tools/aureate_skyborne_composite_plan.py'
      - 'unreal/Tests/test_aureate_skyborne_composite_plan.py'
      - 'unreal/Source/ToSailTheStarrySky/**/AureateWakePreviewActor.*'
      - 'unreal/Docs/AUREATE_WAKE_APPROVED_ART_REFERENCE_2026-11-01.md'
      - 'unreal/Tests/test_unreal_documentation_dependency_authority.py'
      - 'docs/UNREAL_DEPENDENCY_AND_DOCUMENTATION_AUTHORITY_2026-11-01.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/AGENT_HANDOFF_INDEX.md'
      - 'unreal/README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'unreal/ToSailTheStarrySky.uproject'
      - 'unreal/Source/ToSailTheStarrySky/ToSailTheStarrySky.Build.cs'
      - '.github/workflows/unreal-aureate-approved-art-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-approved-art-and-review-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate reference and fail-closed C++ preview boundaries (source only)
        run: python3 -m unittest discover -s unreal/Tests -p test_aureate_approved_art_contract.py -v
      - name: Validate creator's four current form labels and preserve legacy Unreal identifiers
        run: python3 -m unittest discover -s unreal/Tests -p test_aureate_form_naming_v2.py -v
      - name: Source-only engine, dependency manifest and handoff consistency
        run: python3 -m unittest discover -s unreal/Tests -p test_unreal_documentation_dependency_authority.py -v
      - name: Compile and execute exact hull/bridge binding guards (31 cases, no Unreal runtime)
        run: python3 unreal/Tests/check_aureate_body_binding_logic.py
      - name: Validate four-wing Skyborne layout against current C++ pose and creator art
        run: python3 -m unittest discover -s unreal/Tests -p test_aureate_skyborne_composite_plan.py -v
      - name: Existing four-form source invariants
        run: python3 unreal/Tests/check_aureate_preview_source.py
      - name: Native acceptance is not implied
        run: echo "Artwork approved as a visual reference; UE mesh imports, build, physics, fidelity, renders and release remain gated."
