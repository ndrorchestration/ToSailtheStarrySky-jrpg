name: Aureate Wake approved visual reference safety gate
on:
  pull_request:
    paths:
      - 'unreal/ArtSource/ShipReview/aureate_wake_approved_art_contract.json'
      - 'unreal/ArtSource/ShipReview/verify_aureate_reference.py'
      - 'unreal/Tests/test_aureate_approved_art_contract.py'
      - 'unreal/Source/ToSailTheStarrySky/**/AureateWakePreviewActor.*'
      - 'unreal/Docs/AUREATE_WAKE_APPROVED_ART_REFERENCE_2026-11-01.md'
      - '.github/workflows/unreal-aureate-approved-art-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-approved-art-and-review-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate reference and fail-closed C++ preview boundaries (source only)
        run: python3 -m unittest discover -s unreal/Tests -p test_aureate_approved_art_contract.py -v
      - name: Existing four-form source invariants
        run: python3 unreal/Tests/check_aureate_preview_source.py
      - name: Native acceptance is not implied
        run: echo "Artwork approved as a visual reference; UE mesh imports, build, physics, fidelity, renders and release remain gated."
